sample:
  name: EXMIF Flash Test
  description: Test external flash via EXMIF (W25Q256FW)

tests:
  sample.drivers.exmif_flash_test:
    tags: flash exmif
    platform_allow: nrf54h20dk/nrf54h20/cpuapp
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Result: ALL TESTS PASSED"
